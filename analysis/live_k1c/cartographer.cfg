# Cartographer 3D - K1C 2025 (X2600).  Mount: Skeletor MK7 (bottom path).
# coexist mode: prtouch_v3 stays the "probe" object so the Creality
# touchscreen leveling keeps working. Cartographer handles scanning/mesh.
# bed_mesh lives in printer.cfg (edited in place to avoid a duplicate section).

[mcu cartographer]
serial: /dev/ttyACM0

[cartographer]
mcu: cartographer
x_offset: 0
y_offset: -22
register_as_probe: False
macro_prefix: CARTO
travel_speed: 50
lift_speed: 5
verbose: False

[cartographer coil]

[cartographer scan]
samples: 20
probe_speed: 5
mesh_runs: 2
mesh_height: 3

[cartographer touch]
samples: 3
retract_distance: 2.0
sample_range: 0.010
