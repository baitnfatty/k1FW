# ==========================================================================
#  Working replacements for Fluidd's dead "Moonraker Database" buttons.
#
#  On this firmware nexusp returns 403 "Method unimplemented" for
#  database list / compact / backup / restore, so the System-page buttons
#  do nothing. These macros do the real work and appear in Fluidd's Macros
#  panel instead.
#
#  Requires extras/carto_shell_command.py. Commands are declared HERE, so
#  g-code can only invoke a named command - never arbitrary shell.
# ==========================================================================

[carto_shell_command db_backup]
command: sh /usr/data/tools/db-tool.sh backup
timeout: 120
verbose: True

[carto_shell_command db_compact]
command: sh /usr/data/tools/db-tool.sh compact
timeout: 180
verbose: True

[carto_shell_command db_list]
command: sh /usr/data/tools/db-tool.sh list
timeout: 60
verbose: True

[carto_shell_command backup_config]
command: sh /usr/data/tools/firmware-backup.sh config
timeout: 300
verbose: True

[carto_shell_command backup_list]
command: sh /usr/data/tools/firmware-backup.sh list
timeout: 60
verbose: True

# --------------------------------------------------------------- buttons --
[gcode_macro BACKUP_CONFIG]
description: Back up printer configs + moonraker db + our mods (seconds)
gcode:
    RUN_SHELL_COMMAND CMD=backup_config

[gcode_macro BACKUP_LIST]
description: List existing backups and free space
gcode:
    RUN_SHELL_COMMAND CMD=backup_list

[gcode_macro DB_BACKUP]
description: Moonraker database backup (replaces Fluidd's broken button)
gcode:
    RUN_SHELL_COMMAND CMD=db_backup

[gcode_macro DB_COMPACT]
description: Moonraker database VACUUM (replaces Fluidd's broken button)
gcode:
    RUN_SHELL_COMMAND CMD=db_compact

[gcode_macro DB_LIST]
description: Moonraker database namespaces (replaces Fluidd's broken list)
gcode:
    RUN_SHELL_COMMAND CMD=db_list

# NOTE: the full firmware backup (~175MB, several minutes) is deliberately
# NOT a button - it would block the console. Run it over SSH:
#     sh /usr/data/tools/firmware-backup.sh full
