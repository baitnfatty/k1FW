# ==========================================================================
#  Cartographer buttons for Fluidd / Mainsail  —  2025 K1C / K1 Max
#
#  Ordered A,B,C,D (letters, NOT digits: Creality's gcode parser truncates
#  names containing digits -> 'CARTO_1_SCAN_CALIBRATE' fails as
#  Unknown command:"CARTO_1").
#
#  ORDER MATTERS: SCAN first. The scan paper-test establishes Z=0, which
#  gives TOUCH a safe reference so the nozzle does not drive into the bed.
#
#  'macro_prefix' must NOT be set in [cartographer] or the plugin's own
#  CARTO_* aliases collide with these names.
# ==========================================================================

# ---- calibration, in order (bed heat-soaked, nozzle CLEAN and COLD) ------
[gcode_macro CARTO_A_SCAN_CALIBRATE]
description: STEP 1 - scan calibration, interactive paper test. Sets Z reference. Homes X/Y first.
gcode:
    {% if 'xy' not in printer.toolhead.homed_axes %}
        G28 X Y
    {% endif %}
    CARTOGRAPHER_SCAN_CALIBRATE {rawparams}

[gcode_macro CARTO_B_TOUCH_CALIBRATE]
description: STEP 2 - touch calibration. Requires XYZ homed + nozzle clean/cold. Capped threshold for safety.
gcode:
    {% if 'z' not in printer.toolhead.homed_axes %}
        { action_raise_error("Home Z first (G28). Touch needs a Z reference or it can drive into the bed.") }
    {% endif %}
    {% if printer.extruder.temperature > 150 %}
        { action_raise_error("Nozzle is above 150C - touch would damage the plate. Let it cool.") }
    {% endif %}
    # MAX raised from 2500: the glass/spring bed stack softens the contact
    # signature, and workable thresholds can sit above the old cap.
    CARTOGRAPHER_TOUCH_CALIBRATE MAX=5000 {rawparams}

[gcode_macro CARTO_C_BED_MESH]
description: STEP 3 - run a bed mesh scan (uses the scan model)
#  NOTE: scan is the ONLY mesh. 'BED_MESH_CALIBRATE METHOD=touch' is NOT
#  implemented upstream (docs.cartographer3d.com confirms) - it silently falls
#  back to Klipper's native point-by-point mesh driven by the CONTACTLESS scan
#  probe object, so it never touches and is just a slow scan mesh.
gcode:
    {% if 'xyz' not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    BED_MESH_CALIBRATE {rawparams}

[gcode_macro CARTO_D_SAVE]
description: STEP 4 - SAVE_CONFIG. Writes models to printer.cfg and restarts Klipper.
gcode:
    SAVE_CONFIG

# ---- homing / probing ----------------------------------------------------
#  TOUCH FALSE-TRIGGER ZONE (glass-modded beds): the glass layer distorts the
#  coil's frequency->distance curve around ~3mm, and the firmware's touch
#  detector ("distance stopped decreasing" = contact) false-triggers there
#  UNLESS the descent starts below the zone (<=2.5mm) or far above it (>=10mm,
#  enough run-up to converge). Stock CARTOGRAPHER_TOUCH_HOME hops +2 from the
#  2.0mm scan-park height and descends from ~4.0 -> false trigger at ~2.9mm,
#  never touching. Verified on the K1C: descent from 2.5 touches for real.
[gcode_macro CARTO_TOUCH_HOME]
description: Home Z by touch. Scan-homes Z first, then starts the touch descent
  from 2.5mm (below the ~3mm false-trigger zone of the glass bed stack).
gcode:
    {% if 'xy' not in printer.toolhead.homed_axes %}
        G28
    {% else %}
        G28 Z                              # always re-scan-home: guarantees Z0.5 is real
    {% endif %}
    {% if printer.extruder.temperature > 150 %}
        { action_raise_error("Nozzle is above 150C - touch would damage the plate. Let it cool.") }
    {% endif %}
    {% set zrp = printer.configfile.settings.bed_mesh.zero_reference_position %}
    G90
    G1 X{zrp[0]} Y{zrp[1]} F6000           # over the zero-reference point
    G1 Z0.5 F600                           # TouchHome hops +2 -> descent starts at 2.5
    CARTOGRAPHER_TOUCH_HOME

[gcode_macro CARTO_TOUCH_VERIFY]
description: Prove touch is really touching. After a scan G28 (bed = Z0), a real
  touch must read ~0; a mid-air false trigger reads its height above the bed.
gcode:
    G28
    {% set zrp = printer.configfile.settings.bed_mesh.zero_reference_position %}
    G90
    G1 X{zrp[0]} Y{zrp[1]} F6000
    G1 Z0.5 F600                           # start below the false-trigger zone
    CARTO_TOUCH_PROBE
    _CARTO_TOUCH_VERIFY_CHECK

[gcode_macro _CARTO_TOUCH_VERIFY_CHECK]
description: Internal - must be a separate macro so its template renders AFTER
  the touch probe has completed (Klipper renders a whole macro before running it).
gcode:
    {% set r = printer.cartographer.touch.last_z_result %}
    {% if r is none %}
        { action_raise_error("Touch verify: no touch result recorded.") }
    {% elif r|abs > 0.3 %}
        { action_raise_error("Touch verify FAILED: triggered %.3fmm above the bed - mid-air false trigger. Do NOT trust CARTO_TOUCH_HOME. Recalibrate touch (watch for real nozzle contact) and check the descent start height." % r) }
    {% else %}
        { action_respond_info("Touch verify OK: contact at z=%.4f" % r) }
    {% endif %}

[gcode_macro CARTO_TOUCH_PROBE]
description: Touch the bed, report height at current position
gcode:
    CARTOGRAPHER_TOUCH_PROBE

[gcode_macro CARTO_SCAN_PROBE]
description: Scan (no contact), report height at current position
gcode:
    CARTOGRAPHER_SCAN_PROBE

# ---- diagnostics (safe, no motion unless noted) --------------------------
[gcode_macro CARTO_QUERY]
description: Query cartographer state - safe, no motion
gcode:
    CARTOGRAPHER_QUERY

[gcode_macro CARTO_LOAD_SCAN_MODEL]
description: Load the saved scan model named 'default'
gcode:
    CARTOGRAPHER_SCAN_MODEL LOAD=default

[gcode_macro CARTO_LOAD_TOUCH_MODEL]
description: Load the saved touch model named 'default'
gcode:
    CARTOGRAPHER_TOUCH_MODEL LOAD=default

[gcode_macro CARTO_TOUCH_ACCURACY]
description: Repeat touches to measure repeatability (nozzle contacts bed)
gcode:
    CARTOGRAPHER_TOUCH_ACCURACY {rawparams}

[gcode_macro CARTO_SCAN_ACCURACY]
description: Collect scan samples and report statistics (no contact)
gcode:
    CARTOGRAPHER_SCAN_ACCURACY {rawparams}

[gcode_macro CARTO_ESTIMATE_BACKLASH]
description: Estimate Z axis backlash
gcode:
    CARTOGRAPHER_ESTIMATE_BACKLASH {rawparams}

[gcode_macro CARTO_TEMPERATURE_CALIBRATE]
description: Calibrate temperature compensation for frequency drift
gcode:
    CARTOGRAPHER_TEMPERATURE_CALIBRATE {rawparams}

[gcode_macro CARTO_AXIS_TWIST_COMPENSATION]
description: Axis twist compensation (needs [axis_twist_compensation])
gcode:
    CARTOGRAPHER_AXIS_TWIST_COMPENSATION
