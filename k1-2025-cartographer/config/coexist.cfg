# ==========================================================================
#  Cartographer alongside Creality's prtouch_v3  —  2025 K1C / K1 Max
#
#  register_as_probe: False  =>  Cartographer does NOT claim the "probe"
#  object, so [prtouch_v3] keeps working and Creality's touchscreen
#  leveling stays functional. Cartographer's endstop is exposed under the
#  "cartographer_probe:" pin chip instead.
#
#  Use this if you want to keep the stock UI working.
#  Include from printer.cfg:   [include cartographer.cfg]
# ==========================================================================

[mcu cartographer]
serial: /dev/ttyACM0
baud: 115200
# 115200 is REQUIRED: this kernel's cdc_acm rejects Klipper's default
# 250000 with "Failed to set custom baud rate ... Inappropriate ioctl".
# USB CDC ignores the rate anyway.
# This image uses mdev - /dev/serial/by-id does NOT exist. The only other
# USB device is the internal CREALITY CAM (a video device), so ttyACM0 is
# stable. Verify with: ls -l /dev/ttyACM*

[cartographer]
mcu: cartographer

#  Skeletor MK7 (verified from pellcorp/creality). Same on K1C + K1 Max.
#  If you use the LOW-PROFILE probe or an alternate mount path, verify by
#  measuring nozzle-tip to coil-centre - the published value assumes the
#  standard variant.
#  Distance from the NOZZLE to the probe COIL centre, in mm.
#  +x = right, +y = back.
x_offset: 0
y_offset: -22

register_as_probe: False     # keep prtouch_v3 as the "probe" object
macro_prefix: CARTO          # also registers CARTO_* aliases
travel_speed: 50
lift_speed: 5
verbose: False

[cartographer coil]
# populated automatically by temperature calibration

[cartographer scan]
samples: 20
probe_speed: 5
mesh_runs: 2
mesh_height: 3

[cartographer touch]
samples: 3
retract_distance: 2.0
sample_range: 0.010

# --------------------------------------------------------------------------
#  Bed mesh. The COIL must reach every mesh point, not the nozzle - so the
#  mesh shrinks by your x/y offset.
#  Values below are SkeletorMK7 (x 0 / y -22), verified from pellcorp:
#    K1C    (220x220):  mesh_min 10,5    mesh_max 210,200   zero_ref 110,110
#    K1 Max (300x300):  mesh_min 10,13   mesh_max 290,273   zero_ref 150,150
#  Other mounts: see ../mounts/mounts.tsv
#
#  Reachability: nozzle_Y = mesh_Y - y_offset must stay <= stepper_y
#  position_max. K1C: 200-(-22)=222 vs position_max 225. Clears by 3mm.
# --------------------------------------------------------------------------
[bed_mesh]
speed: 80
horizontal_move_z: 5
mesh_min: 10, 5
mesh_max: 210, 200
probe_count: 15, 15
zero_reference_position: 110, 110
algorithm: bicubic
bicubic_tension: 0.2
