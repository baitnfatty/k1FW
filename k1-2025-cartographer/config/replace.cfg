# ==========================================================================
#  Cartographer AS the probe  —  2025 K1C / K1 Max
#
#  register_as_probe: True (default) => Cartographer claims the "probe"
#  object and provides probe:z_virtual_endstop for Z homing.
#
#  YOU MUST comment out [prtouch_v3] in printer.cfg, or Klipper will fail
#  to start (two objects cannot both register as "probe").
#
#  Expect Creality's touchscreen auto-level flow to misbehave - it is built
#  around the strain-gauge probe. Fluidd / Orca / printing are unaffected.
#
#  Include from printer.cfg:   [include cartographer.cfg]
# ==========================================================================

[mcu cartographer]
serial: /dev/ttyACM0
baud: 115200
# 115200 is REQUIRED: this kernel's cdc_acm rejects Klipper's default
# 250000 with "Failed to set custom baud rate ... Inappropriate ioctl".
# USB CDC ignores the rate anyway.
# mdev image - /dev/serial/by-id does NOT exist. Verify: ls -l /dev/ttyACM*

[cartographer]
mcu: cartographer

#  Skeletor MK7 (verified from pellcorp/creality). Same on K1C + K1 Max.
#  If you use the LOW-PROFILE probe or an alternate mount path, verify by
#  measuring nozzle-tip to coil-centre - the published value assumes the
#  standard variant.
x_offset: 0
y_offset: -22

register_as_probe: True
travel_speed: 50
lift_speed: 5
verbose: False

[cartographer coil]

[cartographer scan]
samples: 20
probe_speed: 5
mesh_runs: 2
mesh_height: 3

[cartographer touch]
samples: 3
retract_distance: 2.0
sample_range: 0.010

# --------------------------------------------------------------------------
#  REQUIRED changes in printer.cfg when using this file:
#
#    [stepper_z]
#    endstop_pin: probe:z_virtual_endstop
#    homing_retract_dist: 0        <-- the plugin REQUIRES this to be 0
#
#    #[prtouch_v3]                 <-- comment out the WHOLE block
#    #...
# --------------------------------------------------------------------------

# --------------------------------------------------------------------------
#  Bed mesh - the COIL must reach every point, so shrink by your x/y offset.
#
#  Values below are SkeletorMK7 (x 0 / y -22), verified from pellcorp:
#    K1C    (220x220):  mesh_min 10,5    mesh_max 210,200   zero_ref 110,110
#    K1 Max (300x300):  mesh_min 10,13   mesh_max 290,273   zero_ref 150,150
#  Other mounts: see ../mounts/mounts.tsv
# --------------------------------------------------------------------------
[bed_mesh]
speed: 80
horizontal_move_z: 5
mesh_min: 10, 5
mesh_max: 210, 200
probe_count: 15, 15
zero_reference_position: 110, 110
algorithm: bicubic
bicubic_tension: 0.2
