# safe_wipe.cfg — silicone-pad nozzle wipe for the 2025 K1C / K1 Max (X2600)
#
# Ported from the SimpleAF safe-wipe macro. On this firmware the hook is
# different: Creality's compiled START_PRINT (and G29) call NOZZLE_CLEAR,
# which was registered by prtouch_v3_wrapper. With [prtouch_v3] disabled for
# Cartographer, NOZZLE_CLEAR became an unknown command and every print started
# WITHOUT a wipe. Defining [gcode_macro NOZZLE_CLEAR] here re-plugs the wipe
# into the stock start sequence (right after G28, before bed mesh + purge
# line) with no slicer changes.
#
# NOTE: if [prtouch_v3] is ever re-enabled, DELETE this file's NOZZLE_CLEAR
# macro or Klipper will fail to start (duplicate command).
#
# Stock strip positions (from Creality's prtouch config, wipe X94->124):
#   K1C    : pad center X109 Y224
#   K1 Max : pad center X109 Y300   <-- set pad_y: 300.0 on the Max
#
# wipe_z DEFAULTS HIGH (6.0 = likely above the pad). Measure YOUR pad on the
# glass-modded bed: after a scan G28, jog the nozzle over the pad and lower
# until it presses lightly; put that Z here. (Reference: 4.3 on the SimpleAF
# Max, but the glass stack changes pad height relative to Z0.)

[gcode_macro _WIPER_PARAMS]
# center of the pad
# MEASURED on the glass-modded K1C: 110,222 z2.8. K1 Max: 150,301 z3.8.
variable_pad_x: 110.0
variable_pad_y: 222.0
# Z where the nozzle presses lightly into the pad (MEASURE on your machine)
variable_wipe_z: 2.8
# safe travel height above the pad
variable_approach_z: 10.0
# wipe stroke half-width in X (pad center +/- this)
variable_wipe_span: 15.0
# number of back-and-forth strokes
variable_passes: 6
# wipe speed mm/min
variable_wipe_speed: 6000
# minimum nozzle temp for an effective wipe (below the 150C touch limit)
variable_wipe_temp: 148
# set True to run CARTO_TOUCH_HOME after the wipe (clean nozzle + true Z=0;
# runs before the bed is fully heat-soaked, so expect slight thermal drift)
variable_touch_home_after: False
# set True to force a FRESH adaptive mesh every print: clears the saved mesh
# here, so Creality's compiled START_PRINT (which only meshes when none is
# loaded) runs BED_MESH_CALIBRATE ADAPTIVE=1 itself on every start.
# Requires start_with_bedmesh_cal: True in [gcode_macro_cmd] (stock setting).
variable_fresh_mesh: True
# internal: set after a touch home; makes the G28 wrapper skip one Z re-home
variable_touch_z_valid: False
gcode:

[gcode_macro WIPE_NOZZLE]
description: Scrub the nozzle on the rear silicone pad
gcode:
    {% set p = printer["gcode_macro _WIPER_PARAMS"] %}
    {% if "xyz" not in printer.toolhead.homed_axes %}
      { action_raise_error("WIPE_NOZZLE: printer must be homed first") }
    {% endif %}
    {% set target = printer[printer.toolhead.extruder].target %}
    {% set temp = printer[printer.toolhead.extruder].temperature %}
    {% if temp < p.wipe_temp - 3 %}
      { action_respond_info("WIPE_NOZZLE: heating to %dC for wipe" % p.wipe_temp) }
      M109 S{p.wipe_temp}
    {% endif %}
    SAVE_GCODE_STATE NAME=wipe_state
    G90
    {% if printer.gcode_move.gcode_position.z < p.approach_z %}
      G1 Z{p.approach_z} F1200
    {% endif %}
    G1 X{p.pad_x - p.wipe_span} Y{p.pad_y} F9000
    G1 Z{p.wipe_z} F1200
    {% for i in range(p.passes) %}
      G1 X{p.pad_x + p.wipe_span} Y{p.pad_y - (0 if i % 2 else 1.5)} F{p.wipe_speed}
      G1 X{p.pad_x - p.wipe_span} Y{p.pad_y - (1.5 if i % 2 else 0)} F{p.wipe_speed}
    {% endfor %}
    G1 Z{p.approach_z} F1200
    RESTORE_GCODE_STATE NAME=wipe_state
    {% if temp < p.wipe_temp - 3 and target < p.wipe_temp %}
      M104 S{target}
    {% endif %}
    M400
    _WIPE_REPORT

[gcode_macro _WIPE_REPORT]
description: Internal - fires after the wipe moves actually finish (post-M400)
gcode:
    { action_respond_info("Nozzle wipe complete") }

[gcode_macro _AFTER_TOUCH_HOME]
description: Internal - runs after CARTO_TOUCH_HOME inside NOZZLE_CLEAR.
  Flags Z as touch-homed so the G28 wrapper below skips the scan re-home that
  Creality's compiled START_PRINT issues right after NOZZLE_CLEAR. A scan home
  issued immediately after a touch session leaves the probe MCU mis-armed: it
  descends to CONTACT instead of triggering at 2mm, then dies with "Toolhead
  stopped outside model range" (verified: pre-touch scan homes succeed at the
  same temp/threshold; post-touch ones fail, halt coil reading = contact).
  Skipping the re-home also carries the touch-accurate Z into the print.
gcode:
    {% set r = printer.cartographer.touch.last_z_result %}
    {% if r is none %}
      { action_raise_error("Touch home: no touch result recorded") }
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_WIPER_PARAMS VARIABLE=touch_z_valid VALUE=True
    G90
    G1 Z10 F1200

[gcode_macro G28]
rename_existing: G280
description: G28 wrapper - skips the Z portion once after a touch home (the
  scan re-home would mis-trigger at contact AND overwrite the better touch Z).
gcode:
    {% set p = printer["gcode_macro _WIPER_PARAMS"] %}
    {% set raw = rawparams|upper %}
    {% set bare = raw.split()|length == 0 %}
    {% set wants_z = bare or ('Z' in raw) %}
    {% if p.touch_z_valid and wants_z %}
      SET_GCODE_VARIABLE MACRO=_WIPER_PARAMS VARIABLE=touch_z_valid VALUE=False
      {% if bare %}
        { action_respond_info("G28: Z is touch-homed - homing XY only") }
        G280 X Y
      {% else %}
        {% set keep = raw.replace('Z', ' ').split()|join(' ') %}
        {% if keep %}
          { action_respond_info("G28: Z is touch-homed - running G28 %s only" % keep) }
          G280 {keep}
        {% else %}
          { action_respond_info("G28 Z skipped - Z is touch-homed (scan re-home after touch mis-triggers at contact)") }
        {% endif %}
      {% endif %}
    {% else %}
      G280 {rawparams}
    {% endif %}

# ---- stock-firmware hook -------------------------------------------------
# Creality's compiled START_PRINT runs: G28 -> NOZZLE_CLEAR -> (temps) ->
# adaptive mesh (if needed) -> purge line. G29 (touchscreen level) also calls
# NOZZLE_CLEAR after G28. This macro IS that hook now.
[gcode_macro NOZZLE_CLEAR]
description: Stock start-print wipe hook (was prtouch's; now the safe wipe)
gcode:
    WIPE_NOZZLE
    {% if printer["gcode_macro _WIPER_PARAMS"].touch_home_after %}
      CARTO_TOUCH_HOME
      _AFTER_TOUCH_HOME
    {% endif %}
    {% if printer["gcode_macro _WIPER_PARAMS"].fresh_mesh %}
      { action_respond_info("NOZZLE_CLEAR: clearing mesh - START_PRINT will take a fresh adaptive mesh") }
      BED_MESH_CLEAR
    {% endif %}
