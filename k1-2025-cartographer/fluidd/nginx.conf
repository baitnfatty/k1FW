# Fluidd on :4408 for 2025 K1C/K1Max. Lives in /usr/data (persistent);
# /etc is the RAM initramfs so nothing here may depend on it.
daemon on;
worker_processes 1;
error_log /usr/data/fluidd/logs/error.log warn;
pid /usr/data/fluidd/tmp/nginx.pid;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    client_body_temp_path /usr/data/fluidd/tmp/client;
    proxy_temp_path       /usr/data/fluidd/tmp/proxy;
    fastcgi_temp_path     /usr/data/fluidd/tmp/fastcgi;
    uwsgi_temp_path       /usr/data/fluidd/tmp/uwsgi;
    scgi_temp_path        /usr/data/fluidd/tmp/scgi;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 1024m;
    proxy_read_timeout 600s;

    upstream moonraker { server 127.0.0.1:7125; }

    # Websocket path goes through moonraker-db-shim, which implements the
    # database methods nexusp lacks. nexusp is listed as a BACKUP: if the
    # shim is down nginx falls straight through to it, so the five methods
    # go back to failing but Fluidd keeps working.
    upstream db_shim {
        server 127.0.0.1:4409 max_fails=2 fail_timeout=10s;
        server 127.0.0.1:7125 backup;
    }

    # thirteenthp: Creality's own local WebRTC player. It is a *client* of
    # quintusp's /tmp/h264_uds_chassis fan-out socket, so consuming it here is
    # invisible to Creality Print and the touchscreen -- we never touch
    # /dev/video0, which quintusp owns exclusively.
    upstream creality_webrtc { server 127.0.0.1:8000; }

    server {
        listen 4408;
        server_name _;
        root /usr/data/fluidd/www;
        index index.html;


        # nexusp (Creality Moonraker clone) implements database get/post/delete
        # but NOT list -> 403 "Method unimplemented". Answer it here so HTTP
        # clients get a valid Moonraker-shaped response. NOTE: Fluidd calls this
        # over the websocket, which nginx cannot intercept per-method, so its
        # console warning remains. Harmless: settings persist via get/post.
        location = /server/database/list {
            default_type application/json;
            return 200 '{"result": {"namespaces": ["fluidd", "moonraker", "gcode_metadata", "history"]}}';
        }

        # ---- camera -------------------------------------------------------
        # Creality's WebRTC player, re-served under the Fluidd origin so the
        # camera URL registered with Moonraker can stay RELATIVE ("/webrtc/").
        # Fluidd resolves it with buildAbsoluteUrl() against whatever host the
        # browser used, so nothing here breaks when the printer's DHCP lease
        # changes, and it works the same over IP or <hostname>.local.
        location /webrtc/ {
            proxy_pass http://creality_webrtc/;
            proxy_set_header Host $http_host;
            proxy_buffering off;
        }

        # The player POSTs its SDP offer to an ABSOLUTE path, so this has to be
        # served from the same origin as /webrtc/ or the offer 404s and the
        # video never starts. Exact-match so it cannot shadow a Fluidd route.
        location = /call/webrtc_local {
            proxy_pass http://creality_webrtc/call/webrtc_local;
            proxy_set_header Host $http_host;
            proxy_buffering off;
        }

        # No /server/webcams/ location on purpose: Fluidd fetches the webcam
        # list over the WEBSOCKET, which already goes through the shim, so a
        # REST route would add a dependency on the shim's HTTP port for no
        # gain. Anything else under /server/ still falls through to nexusp.

        location / { try_files $uri $uri/ /index.html; }

        location /websocket {
            proxy_pass http://db_shim/websocket;
            proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $http_host;
            proxy_read_timeout 86400;
        }

        location ~ ^/(printer|api|access|machine|server)/ {
            proxy_pass http://moonraker$request_uri;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
